[project]
name = "relay-serveur"
version = "0.1.0"
description = "Relais chiffré de bout en bout entre l'app Relay et un agent IA"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx[http2]>=0.27",
    "PyJWT[crypto]>=2.9",
    "cryptography>=43",
    "app-store-server-library>=1.5",
]

[project.scripts]
relay-serveur = "relay_serveur.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay_serveur"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
